server:
  port: 8089

spring:
  application:
    name: iot-access
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skylark_iot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:123456}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.skylark.iot.mgmt.model.entity,cn.skylark.iot.access.model

management:
  endpoints:
    web:
      exposure:
        include: health,info

iot:
  access:
    auth:
      use-db: ${IOT_ACCESS_AUTH_USE_DB:true}
    acl:
      use-db: ${IOT_ACCESS_ACL_USE_DB:false}
    emqx:
      base-url: http://emqx:18083
      # 建议在 EMQX Dashboard -> System -> API Key 创建一对 key/secret
      api-key: ${EMQX_API_KEY:}
      api-secret: ${EMQX_API_SECRET:}
    devices:
      - device-id: demo-001
        username: demo-001
        password: demo-001-secret
        # 兼容阿里物模型 Topic 时可不依赖前缀；保留字段便于后续扩展自定义 topic
        publish-prefix: up/demo-001/
        subscribe-prefix: down/demo-001/
